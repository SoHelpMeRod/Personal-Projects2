<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save the Date — Rod & Adriana's Goodbye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #7FCBEA;
    --blue-deep: #2CA9D6;
    --pink: #F8CEDD;
    --pink-deep: #F0A6C0;
    --cream: #FFFBF7;
    --ink: #2E3440;
    --ink-soft: #5B6472;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--blue) 0%, var(--cream) 45%, var(--pink) 100%);
    font-family: 'Manrope', sans-serif;
    padding: 32px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--cream);
    border-radius: 28px;
    padding: 56px 40px 48px;
    text-align: center;
    box-shadow: 0 30px 60px -20px rgba(46, 52, 64, 0.18);
    overflow: hidden;
  }

  .card::before,
  .card::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    opacity: 0.55;
  }

  .card::before {
    width: 180px;
    height: 180px;
    background: var(--blue);
    top: -90px;
    left: -90px;
  }

  .card::after {
    width: 160px;
    height: 160px;
    background: var(--pink);
    bottom: -80px;
    right: -80px;
  }

  .content {
    position: relative;
    z-index: 1;
  }

  .glasses {
    width: 92px;
    height: auto;
    margin-bottom: 18px;
  }

  .eyebrow {
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 6px;
    font-weight: 700;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 64px;
    line-height: 0.95;
    margin: 0 0 22px;
    background: linear-gradient(100deg, var(--blue-deep), var(--pink-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .names {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 4px;
  }

  .subline {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 26px;
    letter-spacing: 0.02em;
  }

  .divider {
    width: 44px;
    height: 2px;
    margin: 0 auto 26px;
    background: linear-gradient(90deg, var(--blue-deep), var(--pink-deep));
    border-radius: 2px;
  }

  .date {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    margin: 0 0 8px;
  }

  .details {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.7;
    margin: 0;
  }

  @media (max-width: 420px) {
    h1 { font-size: 50px; }
    .card { padding: 44px 26px 40px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="content">
      <svg class="glasses" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- left glass (blue) -->
        <path d="M22 14 L46 14 L38 44 C38 52 30 56 26 56 C22 56 14 52 14 44 Z" stroke="#2CA9D6" stroke-width="2.4" stroke-linejoin="round"/>
        <line x1="26" y1="56" x2="26" y2="78" stroke="#2CA9D6" stroke-width="2.4"/>
        <line x1="14" y1="78" x2="38" y2="78" stroke="#2CA9D6" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M18 20 L42 20" stroke="#2CA9D6" stroke-width="1.6" opacity="0.6"/>

        <!-- right glass (pink), clinked toward the left one -->
        <path d="M74 10 L100 16 L84 44 C81 51 72 52 69 46 C66 40 70 33 70 33 Z" stroke="#F0A6C0" stroke-width="2.4" stroke-linejoin="round" transform="rotate(-12 84 30)"/>
        <line x1="79" y1="49" x2="87" y2="70" stroke="#F0A6C0" stroke-width="2.4" transform="rotate(-12 84 30)"/>
        <line x1="75" y1="70" x2="99" y2="70" stroke="#F0A6C0" stroke-width="2.4" stroke-linecap="round" transform="rotate(-12 84 30)"/>

        <!-- little sparkles -->
        <path d="M96 20 L98 24 L102 26 L98 28 L96 32 L94 28 L90 26 L94 24 Z" fill="#F0A6C0" opacity="0.9"/>
        <circle cx="12" cy="30" r="2.2" fill="#2CA9D6" opacity="0.8"/>
      </svg>

      <p class="eyebrow">Save the Date</p>
      <h1>let's&nbsp;toast</h1>

      <p class="names">Rod &amp; Adriana's Goodbye</p>
      <p class="subline">They're off to Austin, Texas — one last round before they go</p>

      <div class="divider"></div>

      <p class="date">November 14th</p>
      <p class="details">
        Food, drinks, and a proper send-off.<br>
        Time and place to follow soon.
      </p>
    </div>
  </div>

</body>
</html>
