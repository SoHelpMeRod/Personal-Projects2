<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save the Date — Rod &amp; Adriana's Engagement + Goodbye</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #7FCBEA;
    --blue-deep: #2CA9D6;
    --pink: #F8CEDD;
    --pink-deep: #F0A6C0;
    --cream: #FFFBF7;
    --ink: #2E3440;
    --ink-soft: #5B6472;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--blue) 0%, var(--cream) 45%, var(--pink) 100%);
    font-family: 'Manrope', sans-serif;
    padding: 32px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--cream);
    border-radius: 28px;
    padding: 56px 40px 48px;
    text-align: center;
    box-shadow: 0 30px 60px -20px rgba(46, 52, 64, 0.18);
    overflow: hidden;
  }

  .card::before,
  .card::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    opacity: 0.55;
  }

  .card::before {
    width: 180px;
    height: 180px;
    background: var(--blue);
    top: -90px;
    left: -90px;
  }

  .card::after {
    width: 160px;
    height: 160px;
    background: var(--pink);
    bottom: -80px;
    right: -80px;
  }

  .content {
    position: relative;
    z-index: 1;
  }

  .glasses {
    width: 92px;
    height: auto;
    margin-bottom: 18px;
  }

  .eyebrow {
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 6px;
    font-weight: 700;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(30px, 8.5vw, 50px);
    line-height: 1.25;
    margin: 0 auto 22px;
    background: linear-gradient(100deg, var(--blue-deep), var(--pink-deep));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: block;
    width: 100%;
    padding: 0 4px;
    box-sizing: border-box;
    white-space: nowrap;
    overflow: visible;
  }

  .names {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    color: var(--ink);
    margin: 0 0 8px;
    line-height: 1.3;
  }

  .subline {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 26px;
    letter-spacing: 0.02em;
    line-height: 1.6;
  }

  .divider {
    width: 44px;
    height: 2px;
    margin: 0 auto 26px;
    background: linear-gradient(90deg, var(--blue-deep), var(--pink-deep));
    border-radius: 2px;
  }

  .date {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
    margin: 0 0 8px;
  }

  .details {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.7;
    margin: 0;
  }

  @media (max-width: 420px) {
    .card { padding: 44px 24px 40px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="content">
      <svg class="glasses" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- left coupe glass (blue), tilted right toward its partner -->
        <g transform="rotate(16 32 84)">
          <path d="M16 18 Q32 12 48 18" stroke="#2CA9D6" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M16 18 Q16 52 32 56 Q48 52 48 18" stroke="#2CA9D6" stroke-width="2.4" stroke-linejoin="round"/>
          <line x1="32" y1="56" x2="32" y2="80" stroke="#2CA9D6" stroke-width="2.4"/>
          <line x1="20" y1="84" x2="44" y2="84" stroke="#2CA9D6" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="27" cy="38" r="1.6" fill="#2CA9D6" opacity="0.6"/>
          <circle cx="36" cy="30" r="1.2" fill="#2CA9D6" opacity="0.5"/>
          <circle cx="30" cy="24" r="1" fill="#2CA9D6" opacity="0.4"/>
        </g>

        <!-- right coupe glass (pink), tilted left toward its partner -->
        <g transform="rotate(-16 88 84)">
          <path d="M72 18 Q88 12 104 18" stroke="#F0A6C0" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M72 18 Q72 52 88 56 Q104 52 104 18" stroke="#F0A6C0" stroke-width="2.4" stroke-linejoin="round"/>
          <line x1="88" y1="56" x2="88" y2="80" stroke="#F0A6C0" stroke-width="2.4"/>
          <line x1="76" y1="84" x2="100" y2="84" stroke="#F0A6C0" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="93" cy="38" r="1.6" fill="#F0A6C0" opacity="0.6"/>
          <circle cx="84" cy="30" r="1.2" fill="#F0A6C0" opacity="0.5"/>
          <circle cx="90" cy="24" r="1" fill="#F0A6C0" opacity="0.4"/>
        </g>

        <!-- clink sparkle where the rims meet -->
        <path d="M60 12 L62 17 L67 19 L62 21 L60 26 L58 21 L53 19 L58 17 Z" fill="#F0A6C0" opacity="0.9"/>
        <circle cx="66" cy="10" r="1.8" fill="#2CA9D6" opacity="0.7"/>
      </svg>

      <p class="eyebrow">Save the Date</p>
      <h1>Let's&nbsp;celebrate</h1>

      <p class="names">Adriana &amp; Rod's<br>Engagement &amp; Goodbye</p>
      <p class="subline">They're getting engaged (Shh...) And they're off to Austin, TX; One big celebration before they go!</p>

      <div class="divider"></div>

      <p class="date">November 14th</p>
      <p class="details">
        Love, laughs, and a proper send-off.<br>
        More details to follow soon.
      </p>
    </div>
  </div>

</body>
</html>
