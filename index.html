<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save the Date — Rod &amp; Adriana's Engagement + Goodbye</title>

<!-- Open Graph Meta Tags for iMessage & Social Previews -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Save the Date — Rod &amp; Adriana" />
<meta property="og:description" content="Engagement &amp; Goodbye Party — November 14th! Join us for a proper send-off before the big move." />
<meta property="og:image" content="https://sohelpmerod.github.io/Personal-Projects2/preview.jpg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green-dark: #1C352D;
    --green-medium: #2A483E;
    --green-light: #3D6154;
    --cream: #FDFBF7;
    --cream-deep: #F3EFE6;
    --gold: #C5A059;
    --ink-soft: #5C6B64;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, var(--green-dark) 0%, #12241E 100%);
    font-family: 'Manrope', sans-serif;
    padding: 32px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--cream);
    border-radius: 28px;
    padding: 56px 40px 48px;
    text-align: center;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }

  .card::before,
  .card::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    opacity: 0.12;
  }

  .card::before {
    width: 220px;
    height: 220px;
    background: var(--green-dark);
    top: -90px;
    left: -90px;
  }

  .card::after {
    width: 180px;
    height: 180px;
    background: var(--gold);
    bottom: -80px;
    right: -80px;
  }

  .content {
    position: relative;
    z-index: 1;
  }

  .glasses {
    width: 92px;
    height: auto;
    margin-bottom: 18px;
  }

  .eyebrow {
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--green-medium);
    margin: 0 0 6px;
    font-weight: 700;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(30px, 8.5vw, 50px);
    line-height: 1.25;
    margin: 0 auto 22px;
    color: var(--green-dark);
    display: block;
    width: 100%;
    padding: 0 4px;
    box-sizing: border-box;
    white-space: nowrap;
    overflow: visible;
  }

  .names {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 500;
    color: var(--green-dark);
    margin: 0 0 8px;
    line-height: 1.3;
  }

  .subline {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 26px;
    letter-spacing: 0.02em;
    line-height: 1.6;
  }

  .divider {
    width: 44px;
    height: 2px;
    margin: 0 auto 26px;
    background: var(--gold);
    border-radius: 2px;
  }

  .date {
    font-family: 'Manrope', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--green-dark);
    margin: 0 0 8px;
  }

  .details {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.7;
    margin: 0;
  }

  @media (max-width: 420px) {
    .card { padding: 44px 24px 40px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="content">
      <svg class="glasses" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- left coupe glass, tilted right toward its partner -->
        <g transform="rotate(16 32 84)">
          <path d="M16 18 Q32 12 48 18" stroke="#1C352D" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M16 18 Q16 52 32 56 Q48 52 48 18" stroke="#1C352D" stroke-width="2.4" stroke-linejoin="round"/>
          <line x1="32" y1="56" x2="32" y2="80" stroke="#1C352D" stroke-width="2.4"/>
          <line x1="20" y1="84" x2="44" y2="84" stroke="#1C352D" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="27" cy="38" r="1.6" fill="#C5A059" opacity="0.8"/>
          <circle cx="36" cy="30" r="1.2" fill="#C5A059" opacity="0.7"/>
          <circle cx="30" cy="24" r="1" fill="#C5A059" opacity="0.6"/>
        </g>

        <!-- right coupe glass, tilted left toward its partner -->
        <g transform="rotate(-16 88 84)">
          <path d="M72 18 Q88 12 104 18" stroke="#1C352D" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M72 18 Q72 52 88 56 Q104 52 104 18" stroke="#1C352D" stroke-width="2.4" stroke-linejoin="round"/>
          <line x1="88" y1="56" x2="88" y2="80" stroke="#1C352D" stroke-width="2.4"/>
          <line x1="76" y1="84" x2="100" y2="84" stroke="#1C352D" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="93" cy="38" r="1.6" fill="#C5A059" opacity="0.8"/>
          <circle cx="84" cy="30" r="1.2" fill="#C5A059" opacity="0.7"/>
          <circle cx="90" cy="24" r="1" fill="#C5A059" opacity="0.6"/>
        </g>

        <!-- clink sparkle where the rims meet -->
        <path d="M60 12 L62 17 L67 19 L62 21 L60 26 L58 21 L53 19 L58 17 Z" fill="#C5A059" opacity="0.9"/>
        <circle cx="66" cy="10" r="1.8" fill="#C5A059" opacity="0.8"/>
      </svg>

      <p class="eyebrow">Save the Date</p>
      <h1>Let's&nbsp;celebrate</h1>

      <p class="names">Adriana &amp; Rod's<br>Engagement &amp; Goodbye</p>
      <p class="subline">They're getting engaged snd they're off to Austin, TX; One big celebration before they go!</p>

      <div class="divider"></div>

      <p class="date">November 14th</p>
      <p class="details">
        Homestead Area, Evening time <br>
        More details to follow soon.
      </p>
    </div>
  </div>

</body>
</html>
